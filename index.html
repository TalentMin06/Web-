<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ed"><title>灵魂底色 · Color Within</title><style>

:root{--ink:#30382f;--muted:#85877b;--paper:#f5f2ed;--accent:#58634a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #aa8752;outline-offset:5px}.shell{max-width:1080px;margin:auto;padding:26px 38px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dcded3;padding-bottom:20px;font-size:12px;letter-spacing:2px}.brand{font-size:16px;letter-spacing:3px}.brand span{display:inline-block;width:13px;height:13px;border-radius:50%;background:#a2ad89;margin-right:10px}.edition{color:var(--muted);font-size:10px}main{min-height:75vh}.hero{position:relative;text-align:center;padding:60px 0 25px}.eyebrow{font-size:10px;letter-spacing:4px;color:#828871}.orb{width:280px;height:280px;margin:28px auto 30px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#eee9aa 0%,#becaa0 30%,#b2c9b4 47%,#a6b4ce 69%,#e4bfa9 95%);box-shadow:inset -18px -20px 35px #ffffff30,0 24px 65px #a1b39330;position:relative;animation:float 7s ease-in-out infinite}.orb:after{content:'';position:absolute;inset:-17px;border:1px solid #adb69940;border-radius:50%}.serif,h1,h2{font-family:"Noto Serif SC","Songti SC",serif;font-weight:400}h1{font-size:43px;line-height:1.5;letter-spacing:6px;margin:15px 0}h1 em{font-style:normal;color:#7c8863}p{font-size:13px;line-height:2;color:#7d8177}.intro{margin:15px 0 25px}.primary{background:var(--ink);color:#fff;border:0;border-radius:3px;padding:17px 30px;min-width:244px;font-size:13px;letter-spacing:2px;display:inline-flex;justify-content:space-between;gap:45px;align-items:center}.primary:hover{background:#56604b}.meta{display:flex;justify-content:center;gap:24px;margin:22px 0 0;font-size:10px;color:#86897d}.bottom{margin:42px 0 20px;border-top:1px solid #dedfd5;padding-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.bottom b{font-size:12px;font-weight:500;display:block;letter-spacing:1px}.bottom p{font-size:11px;line-height:1.8;margin:7px 0}.num{color:#9ba18d;font-family:Georgia;font-size:12px;margin-bottom:12px}footer{font-size:10px;color:#999c90;display:flex;justify-content:space-between;gap:15px;padding:20px 0;line-height:1.8}.quiz{max-width:600px;margin:65px auto}.quiz-top{display:flex;justify-content:space-between;color:#858b79;font-size:11px;letter-spacing:2px}.track{height:2px;background:#dfe2d5;margin:18px 0 48px}.track div{height:100%;background:#758568;transition:width .3s}.quiz h2{font-size:29px;line-height:1.7;margin:10px 0}.hint{font-size:12px;margin:8px 0 32px}.option{display:flex;align-items:center;gap:18px;text-align:left;width:100%;padding:19px 20px;margin:12px 0;background:#ffffff65;border:1px solid #dedfd5;border-radius:5px;color:var(--ink);line-height:1.7;font-size:13px}.option span{font:12px Georgia;color:#989e8a}.option:hover,.option.selected{background:#e4e9da;border-color:#9da98d}.back{background:none;border:0;color:#858b79;font-size:12px;margin-top:18px;padding:10px 0}.result{max-width:620px;margin:45px auto;text-align:center}.result h1{font-size:36px;margin:12px 0}.result .orb{height:180px;width:180px;margin:32px auto}.tags{font-size:11px;letter-spacing:2px;color:#7c876b}.description{max-width:420px;margin:25px auto;font-size:14px;line-height:2.2}.insights{text-align:left;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:30px 0}.insight{background:#ffffff70;border:1px solid #e1e1d7;padding:22px;border-radius:4px}.insight b{font-size:12px;letter-spacing:2px;font-weight:500}.insight p{font-size:12px;margin-bottom:0}.quote{font-family:"Noto Serif SC",serif;font-size:19px;line-height:1.9;margin:30px 0;color:#657354}.secondary{display:block;border:0;background:transparent;color:#828976;font-size:12px;padding:18px;margin:auto}.save-panel img{width:100%;max-width:340px;border-radius:8px;box-shadow:0 8px 40px #3332}.save-panel{margin-top:24px}.notice{font-size:11px}.hidden{display:none!important}@keyframes float{50%{transform:translateY(-7px)}}@media(max-width:600px){.shell{padding:22px 24px}.edition{font-size:9px;letter-spacing:1px}.brand{font-size:13px}.hero{padding-top:43px}h1{font-size:33px;letter-spacing:4px}.orb{width:230px;height:230px;margin:28px auto}.intro{font-size:12px}.bottom{gap:16px;margin-top:36px}.bottom p{font-size:10px}.bottom b{font-size:11px}footer{font-size:9px}.quiz{margin:40px auto}.quiz h2{font-size:25px}.track{margin-bottom:32px}.option{padding:17px 15px}.insight{padding:17px}.result h1{font-size:31px}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style></head><body><div class="shell"><header><div class="brand"><span></span>灵魂底色</div><div class="edition">COLOR WITHIN · VOL. 01</div></header><main id="app"></main><footer><span>每一种底色，都有自己的光。</span><span>娱乐与自我探索 · 非心理诊断</span></footer></div><script>
const questions=[
['终于有一段完全属于自己的时间，你会？',['去公园走走，让思绪慢慢安静','约喜欢的人，分享最近的小事','试一家没去过的小店','在家整理、看书，享受自己的节奏']],
['朋友心情低落时，你更自然的反应是？',['先陪着，给对方说话的空间','用温暖的话让对方知道被在意','带对方做点新鲜事，换个心情','一起梳理问题，找到可行办法']],
['哪一种风景，会让你忍不住停下来？',['晨雾里的森林','落日映红的海面','夜空下流动的极光','清晨安静的街道']],
['面对突然改变的计划，你通常？',['先缓一缓，重新找到节奏','问问同行的人，照顾大家的感受','觉得也许会有意外惊喜','快速确认信息，安排替代方案']],
['在一群人中，你更像是？',['安静却让人安心的存在','让气氛变柔软的连接者','总有奇妙想法的发起者','关键时候值得依靠的协调者']],
['你更想收到哪一种礼物？',['一件有自然气息的日常小物','一封认真写给我的信','一张通往未知目的地的车票','一件刚好解决我需求的东西']],
['最近让你最有满足感的时刻是？',['终于不用赶路，慢慢吃完一顿饭','有人记住了我随口说的小事','把脑海中的点子变成现实','把一件复杂的事情处理妥当']],
['如果生活是一本书，你希望它？',['平淡细腻，越读越有余味','人物真挚，有温热的情感','情节自由，处处藏着意外','结构清晰，每章都有自己的意义']],
['做一个重要决定时，你更愿意听？',['内心是否舒服、是否自在','它会给我与在意的人带来什么','直觉里那个让我兴奋的可能','事实、风险与长期的价值']],
['你喜欢怎样的相处距离？',['各自生长，也能安静相伴','可以分享心事，经常表达关心','一起探索，又保留足够自由','边界清晰，说到的事认真做到']],
['哪句话更接近你此刻的愿望？',['我想把生活过得松弛一些','我想被理解，也想好好爱人','我想勇敢试试不一样的人生','我想走得稳一点，更接近目标']],
['为明天选一个小小的开始，你会选？',['晒十分钟太阳','向在意的人发一句问候','走一条没有走过的路','完成一件搁置已久的小事']]
];
const types=[
{name:'苔绿',en:'MOSS GREEN',hex:'#8b9a73',light:'#dde6c8',tags:'温柔 · 自洽 · 静水深流',desc:'你像森林里柔软的苔，拥有不急着证明自己的力量。比起热闹的答案，你更愿意倾听真实的感受。你细腻、敏锐，也擅长在日常里找到让人安心的小小秩序。',gift:'你能让紧绷的气氛松下来，让身边的人感到可以做自己。',care:'照顾别人的同时，也留意自己的疲惫。温柔不需要以委屈为代价。',love:'你偏爱安静而稳定的陪伴。试着把“我没事”换成具体的需要。',action:'给自己留一段不被安排的时间，去散步，或者只是看看天空。',quote:'不必长成玫瑰，苔也有自己的森林。'},
{name:'蜜桃',en:'PEACH GLOW',hex:'#ce9c8e',light:'#f5d8c7',tags:'共情 · 真诚 · 温暖明亮',desc:'你像傍晚窗边的一束暖光，总能觉察人与人之间细小的情绪。对你来说，被记得的小事、被认真回应的话，比盛大的承诺更动人。你的真诚，让关系有了温度。',gift:'你善于表达在意，也能发现别人没有说出口的期待。',care:'别把所有人的情绪都当成自己的责任。你也值得被认真照顾。',love:'你喜欢有回应的关系。把期待讲清楚，会比默默等待更轻松。',action:'今天给自己写一句肯定，像安慰好朋友那样对自己说话。',quote:'你给世界的温柔，也请留一份给自己。'},
{name:'鸢紫',en:'IRIS DREAM',hex:'#a194bb',light:'#e3daf0',tags:'灵感 · 自由 · 浪漫好奇',desc:'你的心里住着一片不按地图生长的花园。新鲜的体验、偶然的灵感，都可能让你眼睛发亮。你不愿只用一种方式定义自己，更想亲自看看，生活还可以是什么模样。',gift:'你能看到习惯之外的可能，把平凡的日子变得有趣。',care:'灵感很多时，先选一件小事落地。开始不需要完美的准备。',love:'你珍惜一起探索的快乐，也需要独处的空间。自由与亲近可以同时存在。',action:'记下最近最想尝试的一个点子，今天为它做一个十分钟的小行动。',quote:'跟着好奇心走，沿途会长出新的自己。'},
{name:'雾蓝',en:'MIST BLUE',hex:'#819baa',light:'#d4e2e9',tags:'清醒 · 可靠 · 从容坚定',desc:'你像清晨的海，表面平静，内心有自己的方向。面对复杂的事情，你习惯先看清，再行动。你珍惜可靠的承诺，也愿意用一点一滴的努力，让生活更接近想要的样子。',gift:'你能把混乱整理成清晰的路径，在关键时刻给人踏实的支持。',care:'不是所有感受都需要立刻解决。偶尔允许自己停下来，也是一种能力。',love:'你常用行动表达关心。偶尔补上一句心里话，会让对方更懂你的用心。',action:'今天安排一件没有产出目标的小事，让感受暂时走在计划前面。',quote:'慢慢来，你的方向比速度更重要。'}
];
let step=0,answers=[],result=null;const app=document.getElementById('app');
function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">A LITTLE JOURNEY INTO YOURSELF</div><div class="orb" aria-hidden="true"></div><h1>你的灵魂，<br>藏着哪一种<em>底色</em>？</h1><p class="intro">放下外界的定义，听听内心的声音。<br>用 12 个生活切片，遇见更真实的自己。</p><button class="primary" id="start">发现我的底色 <span>↗</span></button><div class="meta"><span>约 2 分钟</span><span>12 道直觉选择</span><span>专属结果卡</span></div></section><div class="bottom"><div><div class="num">01 / FEEL</div><b>跟随第一直觉</b><p>没有标准答案<br>选最像此刻自己的那一个</p></div><div><div class="num">02 / DISCOVER</div><b>读懂你的色彩</b><p>从日常偏好出发<br>发现你的独特相处方式</p></div><div><div class="num">03 / KEEP</div><b>珍藏这一刻</b><p>生成专属色彩卡<br>把关于自己的温柔存下来</p></div></div>`;document.getElementById('start').onclick=()=>{step=0;answers=[];quiz()}}
function quiz(){app.innerHTML=`<section class="quiz"><div class="quiz-top"><span>向内探索</span><span>${String(step+1).padStart(2,'0')} / 12</span></div><div class="track"><div style="width:${(step+1)/12*100}%"></div></div><div class="eyebrow">FOLLOW YOUR FIRST INSTINCT</div><h2>${questions[step][0]}</h2><p class="hint">没有对错，选最接近你的那一个。</p>${questions[step][1].map((s,i)=>`<button class="option ${answers[step]===i?'selected':''}" data-answer="${i}"><span>${'ABCD'[i]}</span>${s}</button>`).join('')}<button class="back" id="back">← ${step?'返回上一题':'返回首页'}</button></section>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.answer);if(step<11){step++;quiz()}else{finish()}window.scrollTo(0,0)});document.getElementById('back').onclick=()=>{if(step){step--;quiz()}else home()}}
function score(a){let scores=[0,0,0,0];a.forEach(v=>scores[v]++);return scores.indexOf(Math.max(...scores))}
function finish(){result=types[score(answers)];try{localStorage.setItem('color-within-result',JSON.stringify({answers,date:Date.now()}))}catch{}showResult()}
function showResult(){const t=result;app.innerHTML=`<section class="result"><div class="eyebrow">YOUR COLOR WITHIN</div><div class="orb" style="background:radial-gradient(circle at 30% 25%,${t.light},${t.hex})"></div><p style="margin-bottom:0">此刻，你的灵魂底色是</p><h1>${t.name} <span style="color:${t.hex}">●</span></h1><div class="eyebrow">${t.en} / ${t.hex.toUpperCase()}</div><p class="tags">${t.tags}</p><p class="description">${t.desc}</p><div class="insights">${[['你的微光',t.gift],['温柔提醒',t.care],['相处说明',t.love],['给今天的小建议',t.action]].map(([a,b])=>`<div class="insight"><b>${a}</b><p>${b}</p></div>`).join('')}</div><div class="quote">“${t.quote}”</div><button class="primary" id="save">生成我的结果卡 <span>↓</span></button><div id="save-panel" class="save-panel hidden"></div><button class="secondary" id="again">重新探索 ↗</button><p class="notice">结果反映本次选择倾向，不定义你的全部。<br>仅供娱乐与自我探索，不作为心理评估或诊断依据。</p></section>`;document.getElementById('save').onclick=saveCard;document.getElementById('again').onclick=()=>{home();window.scrollTo(0,0)}}
function saveCard(){const t=result,c=document.createElement('canvas');c.width=900;c.height=1450;const x=c.getContext('2d');x.fillStyle='#f5f2ed';x.fillRect(0,0,900,1450);x.textAlign='center';x.fillStyle='#6f7867';x.font='20px sans-serif';x.fillText('COLOR WITHIN · 灵魂底色',450,90);let g=x.createRadialGradient(390,280,5,450,340,200);g.addColorStop(0,t.light);g.addColorStop(1,t.hex);x.fillStyle=g;x.beginPath();x.arc(450,340,175,0,Math.PI*2);x.fill();x.fillStyle='#7e8477';x.font='23px sans-serif';x.fillText('此刻，我的灵魂底色是',450,580);x.fillStyle='#30382f';x.font='64px serif';x.fillText(t.name,450,675);x.fillStyle=t.hex;x.font='22px sans-serif';x.fillText(t.en+' / '+t.hex.toUpperCase(),450,728);x.fillStyle='#77816d';x.font='25px sans-serif';x.fillText(t.tags,450,790);x.fillStyle='#555f50';x.font='26px sans-serif';function wrap(s,y,max=650,line=48){let row='';for(const char of s){if(x.measureText(row+char).width>max){x.fillText(row,450,y);y+=line;row=char}else row+=char}if(row)x.fillText(row,450,y);return y}let y=wrap(t.desc,875);x.fillStyle=t.hex;x.fillRect(380,y+55,140,2);x.fillStyle='#55624b';x.font='29px serif';wrap('“'+t.quote+'”',y+125,680,48);x.fillStyle='#95998e';x.font='18px sans-serif';x.fillText('每一种底色，都有自己的光。',450,1328);x.font='15px sans-serif';x.fillText('娱乐与自我探索 · 非心理诊断',450,1375);let url=c.toDataURL('image/png');let panel=document.getElementById('save-panel');panel.classList.remove('hidden');panel.innerHTML='<p>长按下方图片保存，或点击下载按钮</p>';let img=new Image;img.alt='我的'+t.name+'灵魂底色结果卡';img.src=url;panel.appendChild(img);let a=document.createElement('a');a.href=url;a.download='我的灵魂底色-'+t.name+'.png';a.textContent='下载高清结果卡 ↓';a.className='secondary';panel.appendChild(a);document.getElementById('save').textContent='结果卡已生成 ✓';panel.scrollIntoView({behavior:'smooth',block:'start'})}
home();
</script></body></html>
